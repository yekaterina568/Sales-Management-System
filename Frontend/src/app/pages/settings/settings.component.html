<header class="page-header">
    <h1>Profile Settings</h1>
</header>

<div class="settings-grid">
    <div class="card">
        <div class="card-header">
            <h3>Personal Information</h3>
        </div>

        <div class="avatar-section">
            <img [src]="getAvatarUrl()" alt="avatar" class="avatar-preview">
            <div class="avatar-info">
                <p class="avatar-hint">Paste a photo link or leave it blank — an avatar will be generated based on your name</p>
                <input [(ngModel)]="profile.avatarUrl" placeholder="https://example.com/photo.jpg" class="url-input" />
            </div>
        </div>

        <div class="form-group">
            <label>Name</label>
            <input [(ngModel)]="profile.name" placeholder="Your name" />
        </div>

        <div class="form-group">
            <label>Job Title</label>
            <input [(ngModel)]="profile.role" placeholder="e.g. Sales Manager" />
        </div>

        <div class="form-actions">
            <div class="saved-msg" *ngIf="saved">✓ Saved</div>
            <button class="save-btn" (click)="save()">Save Changes</button>
        </div>
    </div>
</div>
