<div class="kanban-page">
  <div class="page-header">
    <h1>Deals</h1>
    <button class="btn-primary" (click)="openModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Deal
    </button>
  </div>

  <div class="loading" *ngIf="loading">Loading deals...</div>

  <div class="board" *ngIf="!loading">
    <div class="column" *ngFor="let stage of stages">
      <div class="column-header">
        <div class="column-title">
          <span class="stage-dot" [style.background]="stageColor(stage)"></span>
          <span>{{ stage }}</span>
          <span class="count-badge">{{ columns[stage].length }}</span>
        </div>
        <div class="column-total">{{ formatValue(getColumnTotal(stage)) }}</div>
      </div>

      <div class="cards-list"
           cdkDropList
           [id]="stage"
           [cdkDropListData]="columns[stage]"
           [cdkDropListConnectedTo]="getConnectedLists()"
           (cdkDropListDropped)="onDrop($event, stage)">

        <div class="deal-card"
             *ngFor="let deal of columns[stage]"
             cdkDrag
             (click)="openDeal(deal.id)">
          <div class="card-drag-handle" cdkDragHandle>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>
          </div>
          <div class="card-body">
            <div class="card-title">{{ deal.title }}</div>
            <div class="card-value">{{ formatValue(deal.value) }}</div>
            <div class="card-meta">
              <span *ngIf="getContactName(deal.contact)" class="card-contact">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                {{ getContactName(deal.contact) }}
              </span>
              <span class="card-date" *ngIf="deal.expected_close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                {{ deal.expected_close }}
              </span>
            </div>
          </div>
          <div class="cdk-drag-placeholder" *cdkDragPlaceholder></div>
        </div>

        <div class="empty-col" *ngIf="columns[stage].length === 0">
          Drop here
        </div>
      </div>

      <button class="add-card-btn" (click)="openModal(stage)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add deal
      </button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>New Deal</h2>
      <button class="modal-close" (click)="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Title *</label>
        <input [(ngModel)]="newDeal.title" placeholder="Deal name" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Value ($) *</label>
          <input type="number" [(ngModel)]="newDeal.value" placeholder="0" min="0" />
        </div>
        <div class="form-group">
          <label>Stage</label>
          <select [(ngModel)]="newDeal.stage">
            <option *ngFor="let s of stages" [value]="s">{{ s }}</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Contact</label>
          <select [(ngModel)]="newDeal.contact">
            <option [ngValue]="null">— None —</option>
            <option *ngFor="let c of contacts" [ngValue]="c.id">{{ c.full_name }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Close Date *</label>
          <input type="date" [(ngModel)]="newDeal.expected_close" />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" (click)="closeModal()">Cancel</button>
      <button class="btn-primary" (click)="saveDeal()" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Create Deal' }}
      </button>
    </div>
  </div>
</div>
