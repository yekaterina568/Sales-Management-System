<header class="page-header">
    <h1>Dashboard</h1>
</header>

<div class="error-msg" *ngIf="error">{{ error }}</div>

<div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats">
        <div class="stat-header">
            <span class="stat-title">{{ stat.title }}</span>
            <div class="stat-icon-bg">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                    <polyline points="16 7 22 7 22 13"></polyline>
                </svg>
            </div>
        </div>
        <div class="stat-value">{{ stat.value }}</div>
        <div class="stat-trend">{{ stat.trend }}</div>
    </div>
</div>

<div class="pipeline-section">
    <div class="section-header">
        <h2>Deal Pipeline</h2>
        <button class="add-btn" (click)="showAddForm = !showAddForm">+ Add Deal</button>
    </div>

    <div class="add-form" *ngIf="showAddForm">
        <h3>New Deal</h3>
        <div class="form-row">
            <input [(ngModel)]="newDeal.title" placeholder="Deal Title" />
            <input [(ngModel)]="newDeal.value" placeholder="Value" type="number" />
        </div>
        <div class="form-row">
            <select [(ngModel)]="newDeal.stage">
                <option value="New">New</option>
                <option value="In Progress">In Progress</option>
                <option value="Negotiation">Negotiation</option>
                <option value="Won">Won</option>
                <option value="Lost">Lost</option>
            </select>
            <input [(ngModel)]="newDeal.expected_close" type="date" placeholder="Expected Close Date" />
        </div>
        <div class="form-actions">
            <button class="cancel-btn" (click)="showAddForm = false">Cancel</button>
            <button class="save-btn" (click)="addDeal()">Save Deal</button>
        </div>
    </div>

    <div class="loading" *ngIf="loading">Loading deals...</div>

    <div class="kanban-board" cdkDropListGroup *ngIf="!loading">
        <div class="kanban-column" *ngFor="let column of columns">
            <div class="column-header" [style.border-top-color]="getBorderColor(column.status)">
                <span class="column-name">{{ column.name }}</span>
                <span class="column-count">{{ column.deals.length }}</span>
            </div>

            <div cdkDropList [cdkDropListData]="column.deals" class="card-list" (cdkDropListDropped)="drop($event)">

                <div class="deal-card" *ngFor="let deal of column.deals" cdkDrag [routerLink]="['/deals', deal.id]">
                    <div class="card-status-dot" [style.background-color]="getBorderColor(deal.stage)"></div>
                    <div class="deal-title">{{ deal.title }}</div>
                    <div class="deal-company">{{ deal.contact || '—' }}</div>
                    <div class="deal-footer">
                        <span class="deal-amount">{{ deal.value | currency:'USD':'symbol':'1.0-0' }}</span>
                    </div>
                    <div class="card-tags" *ngIf="deal.stage === 'Won' || deal.stage === 'Lost'">
                        <span class="tag" [class.won]="deal.stage === 'Won'" [class.lost]="deal.stage === 'Lost'">
                            {{ deal.stage }}
                        </span>
                    </div>
                </div>

                <div class="empty-column" *ngIf="column.deals.length === 0">
                    No deals
                </div>
            </div>
        </div>
    </div>
</div>
