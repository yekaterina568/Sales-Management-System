<header class="page-header">
    <div class="breadcrumb">
        <a routerLink="/dashboard">Dashboard</a>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m9 18 6-6-6-6"></path>
        </svg>
        <span>Analytics</span>
    </div>
</header>

<div class="loading" *ngIf="loading">Loading data...</div>
<div class="error-msg" *ngIf="error">{{ error }}</div>

<ng-container *ngIf="!loading">

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">Total Deals</div>
            <div class="metric-value">{{ totalDeals }}</div>
        </div>
        <div class="metric-card green">
            <div class="metric-label">Won</div>
            <div class="metric-value">{{ wonDeals }}</div>
        </div>
        <div class="metric-card red">
            <div class="metric-label">Lost</div>
            <div class="metric-value">{{ lostDeals }}</div>
        </div>
        <div class="metric-card blue">
            <div class="metric-label">Revenue (Won)</div>
            <div class="metric-value">${{ totalRevenue.toLocaleString() }}</div>
        </div>
        <div class="metric-card purple">
            <div class="metric-label">Win Rate</div>
            <div class="metric-value">{{ winRate }}%</div>
        </div>
    </div>

    <div class="charts-grid">

        <div class="chart-card">
            <h3>Deals by Stage</h3>
            <div class="donut-wrap">
                <canvas #donutCanvas width="220" height="220"></canvas>
                <div class="legend">
                    <div class="legend-item" *ngFor="let stage of stages; let i = index">
                        <span class="dot" [style.background]="stageColors[i]"></span>
                        <span class="legend-label">{{ stage }}</span>
                        <span class="legend-count">{{ stageCounts[i] }}</span>
                        <span class="legend-pct">{{ getStagePercent(i) }}%</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-card">
            <h3>Revenue by Mon
