<div class="search-container">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" placeholder="Search deals, contacts...">
</div>

<div class="user-profile">

    <div class="notifications" (click)="toggleNotifications()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="badge" *ngIf="notifications.length > 0">{{ notifications.length }}</span>

        <div class="notifications-dropdown" *ngIf="showNotifications" (click)="$event.stopPropagation()">
            <div class="dropdown-header">
                <span>Уведомления</span>
                <span class="count-badge">{{ notifications.length }}</span>
            </div>
            <div class="notifications-list" *ngIf="notifications.length > 0">
                <div class="notification-item" *ngFor="let n of notifications" [class.overdue]="n.daysLeft < 0">
                    <div class="notif-icon" [class.task]="n.type === 'task'" [class.deal]="n.type === 'deal'">
                        <svg *ngIf="n.type === 'task'" width="12" height="12" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <polyline points="9 11 12 14 22 4"></polyline>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                        <svg *ngIf="n.type === 'deal'" width="12" height="12" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                        </svg>
                    </div>
                    <div class="notif-body">
                        <div class="notif-title">{{ n.title }}</div>
                        <div class="notif-meta">
                            <span class="notif-type">{{ n.type === 'task' ? 'Задача' : 'Сделка' }}</span>
                            <span class="notif-day" [class.overdue]="n.daysLeft < 0">{{ getDayLabel(n.daysLeft)
                                }}</span>
                        </div>
                    </div>
                    <button class="dismiss-btn" (click)="dismiss(n.id, $event)">×</button>
                </div>
            </div>
            <div class="empty-notifications" *ngIf="notifications.length === 0">
                Нет срочных уведомлений
            </div>
        </div>
    </div>

    <div class="user-info" (click)="toggleUserMenu()">
        <img [src]="getAvatarUrl()" alt="User" class="avatar">
        <div class="user-text">
            <span class="name">{{ profile.name }}</span>
            <span class="role">{{ profile.role }}</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m6 9 6 6 6-6"></path>
        </svg>

        <div class="user-dropdown" *ngIf="showUserMenu" (click)="$event.stopPropagation()">
            <div class="dropdown-profile">
                <img [src]="getAvatarUrl()" alt="" class="dropdown-avatar">
                <div>
                    <div class="dropdown-name">{{ profile.name }}</div>
                    <div class="dropdown-role">{{ profile.role }}</div>
                </div>
            </div>
            <div class="dropdown-divider"></div>
            <a routerLink="/settings" class="dropdown-item" (click)="showUserMenu = false">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
                Настройки профиля
            </a>
        </div>
    </div>

</div>
